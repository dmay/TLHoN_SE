name: Item catalog build and tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-catalog:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure catalog
        run: cmake -S catalog -B build-catalog -A x64 -DBUILD_TESTING=ON
      - name: Build catalog
        run: cmake --build build-catalog --config Release --parallel
      - name: Test catalog
        run: ctest --test-dir build-catalog -C Release --output-on-failure
